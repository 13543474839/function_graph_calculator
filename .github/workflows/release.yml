name: 自动打包发布

on:
  push:
    tags:
      - 'v*'  # 仅当推送 v 开头的标签时触发（如 v1.0、v1.1）

jobs:
  build:
    runs-on: ubuntu-latest  # 使用 Ubuntu 服务器打包
    steps:
      # 1. 拉取代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2. 安装 Python 环境
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 运行打包脚本（生成 release/ 文件夹）
        name: 安装 zip（关键修复）
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: 执行打包脚本
        run: python build.py

      # 4. 压缩为 zip（方便上传）
      - name: 压缩为 zip
        run: cd release && zip -r ../graph-calculator.zip ./*

      # 5. 发布到 GitHub Releases
      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: graph-calculator.zip  # 上传的文件名

