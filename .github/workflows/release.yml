name: 自动打包发布

on:
  push:
    tags:
      - 'v*'  # 仅当推送 v 开头的标签时触发

jobs:
  build:
    runs-on: ubuntu-latest  # 使用 Ubuntu 服务器打包
    steps:
      # 1. 拉取代码
      - name: 拉取代码
        uses: actions/checkout@v4  # 支持 Node.js 24

      # 2. 安装 Python 环境
      - name: 安装 Python
        uses: actions/setup-python@v6  # 升级到 v6，支持 Node.js 24
        with:
          python-version: '3.10'

      # 3. 安装 zip（关键修复）
      - name: 安装 zip
        run: sudo apt-get update && sudo apt-get install -y zip

      # 4. 运行打包脚本（生成 release/ 文件夹）
      - name: 执行打包脚本
        run: python build.py

      # 5. 压缩为 zip（方便上传）
      - name: 压缩为 zip
        run: cd release && zip -r ../graph-calculator.zip ./*

      # 6. 安装 GitHub CLI（用于发布）
      - name: 安装 GitHub CLI
        run: sudo apt-get install -y gh  # 安装官方 CLI 工具

      # 7. 发布到 GitHub Releases（替代 softprops/action-gh-release@v1）
      - name: 发布到 GitHub Releases
        run: |
          # 使用 GitHub CLI 创建发布并上传文件
          gh release create ${{ github.ref_name }} graph-calculator.zip \
            --title "Release ${{ github.ref_name }}" \
            --notes "Auto-generated release by GitHub Actions"



